appId: com.stokk.pos
productName: Stokk POS
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
win:
  target:
    - nsis
    - portable
  artifactName: '${productName}-${version}-${arch}.${ext}'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish: null
