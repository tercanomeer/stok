# Windows paketleme. Kasa PC'lerinde iki kurulum biçimi gerekiyor:
#  - msi      : kurumsal/çok şubeli kurulumlarda sessiz dağıtım (msiexec /qn)
#  - portable : tek dosya, kurulum yetkisi olmayan makinelerde USB'den çalıştırma
appId: com.stokk.pos
productName: Stokk POS
directories:
  output: release
  buildResources: build
# `files` verildiğinde electron-builder varsayılan desenin YERİNE bunu kullanır;
# node_modules yazılmazsa better-sqlite3 pakete girmez ve uygulama açılışta çöker.
files:
  - dist/**
  - dist-electron/**
  - node_modules/**
  - package.json
# Native binding asar arşivinin İÇİNDEN yüklenemez (dlopen gerçek bir dosya yolu ister).
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/@serialport/bindings-cpp/**'
# Yeniden derleme KAPALI.
#
# İki native bağımlılığın da (better-sqlite3, @serialport/bindings-cpp) binding'i
# N-API ile derlenmiştir: Node ABI'sine değil N-API sürümüne bağlıdır ve paketin
# içinde her platform için hazır `prebuilds/` klasörü gelir (`node-gyp-build`
# çalışma anında doğrusunu seçer). Electron için ayrı derlemeye gerek yok.
#
# Açık bırakmak zararsız DEĞİL: @electron/rebuild win32-arm64 için kaynaktan
# derlemeye kalkıyor ve "node-gyp does not support cross-compiling" ile paketleme
# tamamen duruyor. ABI'ye bağlı bir modül eklenirse burası yeniden açılmalı.
npmRebuild: false
win:
  target:
    - msi
    - portable
  artifactName: '${productName}-${version}-${arch}.${ext}'
msi:
  oneClick: false
  perMachine: true
  runAfterFinish: true
portable:
  artifactName: '${productName}-${version}-portable.${ext}'
# Yayın kanalı (electron-updater feed) çalışma anında STOKK_UPDATE_URL ile verilir;
# yayın altyapısı kurulmadan buraya sabit adres yazmak, var olmayan bir sunucuya
# sürekli istek atan kurulumlar üretirdi.
extraMetadata:
  dependencies:
    electron-updater: 6.8.9
publish: null
